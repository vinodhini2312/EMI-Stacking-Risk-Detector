# ==============================================================================
# EMI Stacking Risk Detector - Application Configuration
# ==============================================================================

# Server Configuration
# Dynamically binds to $PORT if provided (standard for Render, Railway, Heroku), otherwise 8080
server.port=${PORT:8080}
spring.application.name=emi-stacking-risk-detector

# JSON Serialization
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================================================================
# SQL Database Configuration (Dual Support: Embedded H2 or PostgreSQL)
# ==============================================================================
# Default: Embedded H2 database stored in ./data/emiguard
# For PostgreSQL in production, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/emiguard;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console (accessible locally at http://localhost:8080/h2-console)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
